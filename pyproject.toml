[project]
name = "ai-ops-project"
version = "0.1.0"
description = "AI Operations Copilot with RAG, analytics, and agent orchestration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pandas",
    "numpy",
    "langchain",
    "langgraph",
    "openai",
    "langchain-openai>=1.7.2",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-postgres>=0.0.19",
    "pypdf>=6.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ops"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
